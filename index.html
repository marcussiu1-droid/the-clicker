<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barrier 1</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    overflow:hidden;
    font-family: 'Courier New', monospace;
}

.container{
    text-align:center;
    position:absolute;
    top:30%;
    left:50%;
    transform:translate(-50%, -50%);
}

h1{
    color:#7ffcff;
    font-size:4rem;
    letter-spacing:8px;
    margin-bottom:20px;
}

.subtitle{
    color:#888;
    font-size:1.2rem;
    margin-bottom:40px;
}

button{
    background:none;
    border:1px solid #7ffcff;
    color:#7ffcff;
    padding:15px 40px;
    font-size:1.1rem;
    cursor:pointer;
    font-family: 'Courier New' , monospace;
    transition:.2s;
}

button:hover{
    background:#7ffcff;
    color:black;
}

/* camouflaged secret */

.secret{

    display:none;

    position:absolute;

    bottom:200px;
    right:140px;

    color:#050505;

    font-size:12px;

    letter-spacing:2px;

    user-select:text;
}

</style>
</head>
<body>

<div class="container">

    <h1>Barrier 1</h1>

    <div class="subtitle">
        Seek, and you shall Find.
    </div>

    <button id="seekButton">
        SEEK
    </button>

</div>

<div class="secret" id="secretMessage">
    31324273477349323975626469574B69584F3346384C44754777374469334F5033
</div>

<script>

let clicks = 0;

const button = document.getElementById("seekButton");
const secret = document.getElementById("secretMessage");

button.addEventListener("click", () => {

    clicks++;

    if(clicks === 776){

        secret.style.display = "block";

    }

});

</script>

</body>
</html>
